<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG Center - App</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f5f7;--dim:#8e8e93;--gold:#e8c15a;--a:rgb(232,193,90);--ease:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;font:13px/1.45 Inter,system-ui,-apple-system,"SF Pro Text",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#aur{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#aur i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:0;transition:opacity 1.6s var(--ease);background:radial-gradient(circle,var(--ac) 0,transparent 62%);animation:dr 24s ease-in-out infinite alternate}
#aur i.dim{opacity:.07}#aur i.on{opacity:.2}
@keyframes dr{to{transform:translate(7vw,5vh) scale(1.18)}}
#pls{position:fixed;inset:0;pointer-events:none;z-index:15}
#pls.off .hit{display:none}
.hit{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;pointer-events:auto;will-change:transform}
.hit:focus-visible{outline:1px dashed #fff}
.lb{position:absolute;left:0;top:0;text-align:center;pointer-events:none;opacity:0;will-change:transform,opacity}
.lb b{display:block;font:600 14px Syne,sans-serif;text-shadow:0 1px 10px #000}
.lb small{color:var(--dim);font-size:10.5px;text-shadow:0 1px 8px #000}
#sunt{position:fixed;left:0;top:0;z-index:16;pointer-events:none;font:800 28px Syne,sans-serif;color:#2a1400;opacity:0;will-change:transform}
#title{position:fixed;z-index:90;pointer-events:none;text-align:center;transform:translate(-50%,-50%)}
#title h1{font:800 clamp(46px,10vw,120px)/1 Syne,sans-serif;letter-spacing:-.02em;white-space:nowrap}
#title h1 span{display:inline-block;will-change:transform,filter,opacity}
#title p{margin-top:14px;color:var(--gold);letter-spacing:.35em;font-size:13px;opacity:0}
.node{position:fixed;left:0;top:0;width:132px;height:112px;z-index:20;text-align:center;transform-origin:50% 33px;visibility:hidden;will-change:transform}
.ic{position:relative;width:66px;height:66px;margin:0 auto 8px;border-radius:23%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 14px 28px -10px var(--c2);transition:transform .6s var(--pop),filter .5s var(--ease),box-shadow .5s var(--ease)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%)}
.ic svg{position:relative;width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.node b{display:block;font:600 14px Syne,sans-serif;text-shadow:0 1px 10px #000}
.node small{display:block;margin-top:2px;color:#a1a1a6;font-size:10.5px;text-shadow:0 1px 8px #000}
.node:hover .ic{transform:scale(1.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 36px -2px var(--c2)}
.node.sel .ic{transform:scale(1.3);box-shadow:inset 0 0 0 1.5px #fff,0 0 50px 0 var(--c2)}
.node.sel .ic::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:1.5px solid var(--c2);animation:pu 2.2s var(--ease) infinite}
.node.dim .ic{filter:saturate(.3) brightness(.65)}
@keyframes pu{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.node.go .ic svg *{stroke-dasharray:120;animation:dw 1.3s var(--ease) both}
@keyframes dw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
.ui{position:fixed;z-index:60;opacity:0;filter:blur(8px);transform:translateY(14px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease),filter 1.1s var(--ease)}
.ui.on{opacity:1;filter:none;transform:none}
#brand{left:28px;top:calc(24px + env(safe-area-inset-top,0px))}
#brand h2{font:800 20px Syne,sans-serif}
#brand p{color:var(--gold);margin-top:3px}
#brand p button{color:var(--dim)}#brand p button:hover{color:#fff}
#status{right:28px;top:calc(24px + env(safe-area-inset-top,0px));text-align:right;color:var(--dim);line-height:1.7}
#status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#30d158;margin-right:6px;box-shadow:0 0 8px #30d158}
#log{left:28px;bottom:36px;color:var(--dim);line-height:1.8;width:230px}
#log div::before{content:"› ";color:var(--gold)}
#quote{left:50%;top:calc(26px + env(safe-area-inset-top,0px));width:min(500px,32vw);margin-left:calc(min(500px,32vw)/-2);text-align:center;font:600 15px/1.5 Syne,sans-serif;min-height:3em}
#qt{background:linear-gradient(100deg,#fff 20%,var(--gold) 45%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
#panel{right:28px;top:50%;width:310px;max-height:78vh;overflow:auto;margin-top:-39vh;padding:22px;border-radius:26px;background:rgba(26,26,30,.78);border:1px solid rgba(255,255,255,.13);scrollbar-width:none}
#pc{transition:opacity .28s var(--ease),transform .28s var(--ease),filter .28s var(--ease)}
#pc.out{opacity:0;transform:translateX(14px);filter:blur(6px)}
#pc>*{animation:up .8s var(--ease) both}#pc>:nth-child(2){animation-delay:.06s}#pc>:nth-child(3){animation-delay:.12s}#pc>:nth-child(4){animation-delay:.18s}#pc>:nth-child(5){animation-delay:.24s}#pc>:nth-child(6){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
#pc h3{font:800 28px Syne,sans-serif;letter-spacing:-.02em}
#pc em{font-style:normal;color:var(--a)}
#pc p{color:#c7c7cc;line-height:1.6;margin:10px 0}
#pc input{width:100%;font:800 24px Syne,sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--a);border-radius:10px;padding:2px 8px;outline:0}
.hd{display:flex;gap:14px;align-items:center}
.orb{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset -5px -6px 10px rgba(0,0,0,.5),0 0 14px -2px var(--g)}
.orb.big{width:58px;height:58px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tiles div{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.07);text-align:center}
.tiles b{display:block;font:600 14px Syne,sans-serif}.tiles small{color:var(--dim);font-size:10px}
.rows{display:grid;gap:6px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;text-align:left;transition:background .3s var(--ease),transform .4s var(--pop)}
.row:hover{background:rgba(255,255,255,.09);transform:translateX(4px)}
.row span:nth-child(2){flex:1;min-width:0}
.row b{display:block;font:600 14px Syne,sans-serif}.row small{color:var(--dim);font-size:10.5px}
.row i{font-style:normal;color:var(--dim)}
.row .ic{margin:0;width:40px;height:40px;flex:none}.row .ic svg{width:20px;height:20px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ch span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.09);color:#d1d1d6;font-size:11px}
.gh{margin-top:12px;color:var(--dim)}.gh:hover{color:#fff}
.pr{padding:10px 18px;border-radius:99px;background:var(--ink);color:#000;font-weight:500;transition:transform .4s var(--pop)}.pr:hover{transform:scale(1.07)}
#pc .ic.lg{margin:0 0 14px;width:60px;height:60px}
#dockw{left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
#dock{pointer-events:auto;display:flex;gap:16px;padding:12px 20px 9px;border-radius:30px;background:rgba(26,26,30,.8);border:1px solid rgba(255,255,255,.14)}
#dock button{color:var(--dim);font-size:10.5px;display:grid;justify-items:center;gap:6px;transition:color .4s}
#dock button.on{color:#fff}
#dock .orb{width:40px;height:40px;transform-origin:50% 100%}
@media(max-width:820px){#log,#status{display:none}#quote{left:20px;top:64px;width:calc(100% - 40px);margin:0;text-align:left;font-size:13px}#panel{right:auto;left:14px;top:auto;bottom:calc(98px + env(safe-area-inset-bottom,0px));margin:0;width:calc(100% - 28px);max-height:34vh;padding:14px}#brand{left:20px}#dock{gap:9px;padding:10px 12px 8px}#dock .orb{width:32px;height:32px}.tiles{margin:8px 0}}
@media(prefers-reduced-motion:reduce){#qt,#aur i{animation:none}}

#vig{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.85) 100%)}
#aur i:not(.on):not(.dim){animation-play-state:paused}
.ic{border-radius:25%;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.13),rgba(255,255,255,0) 58%),linear-gradient(160deg,#16161a,#08080a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),inset 0 -12px 20px -12px var(--c2),0 14px 28px -14px var(--c2)}
.ic::before{content:none}
.ic svg{stroke:var(--c1);stroke-width:1.7;filter:drop-shadow(0 0 5px var(--c2))}
.node:hover .ic,.node:focus-visible .ic{box-shadow:inset 0 0 0 1px var(--c1),inset 0 -12px 20px -12px var(--c2),0 0 34px -4px var(--c2)}
.node.sel .ic{background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 46px -2px var(--c2)}
.node.sel .ic svg{stroke:#060606;filter:none}
#panel{border-radius:6px;background:linear-gradient(180deg,rgba(20,20,24,.9),rgba(8,8,10,.92));border-color:rgba(255,255,255,.1);overflow:visible;padding:22px 22px 18px}
#panel::before,#panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--a);transition:border-color .8s}
#panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
#panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 6px 0}
#pc{max-height:calc(78vh - 40px);overflow:auto;scrollbar-width:none}
.row{position:relative;border-radius:8px;border-left:2px solid transparent;padding:8px 12px 8px 10px}
.row:hover{background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,0));transform:none;border-left-color:var(--a)}
.row::after{content:"›";position:absolute;right:12px;top:50%;margin-top:-.75em;font-size:18px;color:var(--a);opacity:0;transform:translateX(-6px);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.row:hover::after{opacity:1;transform:none}
.row i{margin-right:16px}
.tiles{gap:0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.tiles div{background:none;border-radius:0;padding:12px 4px;border-left:1px solid rgba(255,255,255,.1)}.tiles div:first-child{border:0}
.ch span{border-radius:6px;background:none;border:1px solid rgba(255,255,255,.14);padding:3px 9px}
.ch span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--a);margin-right:7px;vertical-align:1px}
.pr{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));color:#fff;border:1px solid var(--a);border-radius:10px;padding:11px 18px;position:relative;overflow:hidden;letter-spacing:.02em;transition:transform .45s var(--pop),box-shadow .5s var(--ease)}
.pr:hover{transform:scale(1.03);box-shadow:0 0 26px -6px var(--a)}.pr:active{transform:scale(.97)}
.pr::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.pr:hover::before{transform:translateX(120%)}
.gh{font-size:11px;transition:color .3s,transform .4s var(--ease)}.gh:hover{transform:translateX(-3px)}
#dock{border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);gap:14px;padding:11px 16px 9px}
#dock button::after{content:"";width:16px;height:2px;border-radius:2px;background:var(--a);box-shadow:0 0 10px var(--a);transform:scaleX(0);transition:transform .6s var(--pop)}
#dock button.on::after{transform:none}
@media(max-width:820px){#dock{gap:9px;padding:10px 12px 8px}#pc{max-height:calc(34vh - 28px)}}
.ui{transition-duration:1.7s;transition-timing-function:cubic-bezier(.32,.72,0,1)}

#verse{position:fixed;inset:0;z-index:95;pointer-events:none;display:grid;place-content:center;text-align:center;font-family:"Cormorant Garamond",Georgia,serif}
#v1{font-style:italic;font-weight:500;font-size:clamp(18px,2.4vw,28px);color:#a9a49a;letter-spacing:.05em;opacity:0}
#v2{font:600 clamp(64px,13vw,180px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;margin-top:6px;white-space:nowrap}
#v2 span{display:inline-block;opacity:0;will-change:transform,filter,opacity}
#v3{position:fixed;left:0;right:0;font:italic 500 clamp(18px,2.4vw,28px) "Cormorant Garamond",Georgia,serif;color:var(--gold);opacity:0;letter-spacing:.06em}
#skp{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));color:#6b6860;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:0}
#title h1{font-size:clamp(34px,5.2vw,66px)}#title h1 span{opacity:0}
#mk{position:fixed;z-index:120;opacity:0;pointer-events:none;transform:translateY(8px) scale(.96);transition:opacity .35s var(--ease),transform .5s var(--pop);width:240px;padding:12px;border-radius:14px;background:rgba(14,14,18,.94);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 50px -10px #000}
#mk.on{opacity:1;pointer-events:auto;transform:none}
#mk input{width:100%;font:500 15px Inter,system-ui,sans-serif;color:#fff;background:none;border:0;border-bottom:1px solid var(--gold);padding:6px 2px;outline:0}
#mk small{display:block;margin-top:8px;color:var(--dim);font-size:11px}
#toast{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));text-align:center;z-index:70;pointer-events:none;font:italic 500 22px "Cormorant Garamond",Georgia,serif;color:var(--gold);letter-spacing:.05em;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
#toast.on{opacity:1;transform:none}
.ic{border-radius:50%;transform:translateZ(0);background:radial-gradient(circle at 50% 120%,var(--c2),transparent 62%),radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 55%),#07070a;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 55%,transparent),inset 0 -10px 18px -10px var(--c2),0 12px 26px -12px var(--c2)}
.ic::before{content:"";position:absolute;left:-26%;right:-26%;top:50%;height:46%;margin-top:-23%;border:1px solid var(--c1);border-radius:50%;opacity:.5;transform:rotate(-24deg);z-index:-1;background:none}
.row .ic::before{display:none}
.ic svg{width:34px;height:34px;fill:none;stroke:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--c2))}
.row .ic svg{width:22px;height:22px}
.ic svg .p{stroke:var(--c1)}.ic svg .q{stroke:var(--c2)}.ic svg .w{stroke:#fff}
.ic svg .fp{fill:var(--c1)}.ic svg .fq{fill:var(--c2)}.ic svg .fw{fill:#fff}.ic svg .g{opacity:.4}
.node.sel .ic{background:linear-gradient(145deg,var(--c1),var(--c2))}
.node.sel .ic svg .p,.node.sel .ic svg .q,.node.sel .ic svg .w{stroke:#060606}.node.sel .ic svg .fp,.node.sel .ic svg .fq,.node.sel .ic svg .fw{fill:#060606}
.node.sel .ic svg{filter:none}
#pc .ic.lg{width:64px;height:64px}#pc .ic.lg svg{width:38px;height:38px}
.lb small,.node small,.row small,.tiles small{letter-spacing:.01em}

:root{--apple:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.45,.64,1)}
#wins{position:fixed;inset:0;pointer-events:none;z-index:61}
.win canvas{position:static;inset:auto;cursor:default;touch-action:auto}
.win{position:fixed;left:0;top:0;pointer-events:auto;will-change:transform}
.win.gone{pointer-events:none;visibility:hidden;transition:visibility 0s .65s}
.wf{border-radius:18px;background:linear-gradient(180deg,rgba(30,30,36,.93),rgba(13,13,17,.95));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 26px 60px -26px #000,0 2px 10px rgba(0,0,0,.4);transition:transform .8s var(--spring),opacity .6s var(--apple),filter .6s var(--apple),box-shadow .6s var(--apple);transform-origin:50% 0}
.win.gone .wf{opacity:0;transform:scale(.9) translateY(10px);filter:blur(10px)}
.win:not(.gone) .wf{animation:wIn .95s var(--spring) both}
@keyframes wIn{from{opacity:0;transform:scale(.92) translateY(16px);filter:blur(12px)}}
.win.drag .wf{transform:scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 40px 80px -24px #000,0 0 0 1px rgba(232,193,90,.28)}
.win.pulse .wf{animation:wPulse 1.3s var(--apple)}
@keyframes wPulse{40%{box-shadow:0 0 0 1px var(--gold),0 0 56px -4px rgba(232,193,90,.65)}}
.win header{display:flex;align-items:center;padding:11px 13px 9px;cursor:grab;user-select:none;touch-action:none}
.win.drag header{cursor:grabbing}
.win header b{flex:1;text-align:center;margin-right:54px;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.02em;color:#d8d8de}
.dots{display:flex;gap:7px}
.dots button{width:12px;height:12px;border-radius:50%;position:relative;transition:transform .35s var(--spring),filter .3s}
.dots button::after{position:absolute;inset:0;display:grid;place-items:center;font:700 9px/12px Inter,sans-serif;color:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.wc{background:#ff5f57}.wm{background:#febc2e}.wg{background:#28c840}
.dots:hover .wc::after{content:"×";opacity:1}.dots:hover .wm::after{content:"–";opacity:1}.dots:hover .wg::after{content:"↺";opacity:1}
.dots button:hover{transform:scale(1.2)}.dots button:active{transform:scale(.9)}
.wb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .75s var(--apple),opacity .5s var(--apple),filter .5s var(--apple)}
.wi{min-height:0;overflow:hidden}
.wp{padding:0 14px 14px}
.win.min .wb{grid-template-rows:0fr;opacity:0;filter:blur(6px)}
#pc{max-height:min(58vh,calc(100vh - 340px));overflow:auto;scrollbar-width:none}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--dim)}
.kv b{color:#f5f5f7;font-weight:500}
#t_cv{width:100%;height:46px;display:block;margin:6px 0}
#r_cv{width:100%;height:150px;display:block;border-radius:12px;cursor:crosshair;background:radial-gradient(circle,rgba(232,193,90,.07),transparent 70%);touch-action:none}

#n_t{width:100%;height:112px;resize:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#f0f0f3;font:13px/1.5 Inter,system-ui,sans-serif;padding:10px;outline:0;transition:border-color .35s var(--apple),background .35s var(--apple)}
#n_t:focus{border-color:var(--gold);background:rgba(255,255,255,.07)}
#n_s{display:block;margin-top:6px;color:var(--dim);font-size:11px}
#hm{position:fixed;z-index:110;bottom:calc(112px + env(safe-area-inset-bottom,0px));left:50%;min-width:240px;padding:12px;border-radius:20px;background:rgba(22,22,27,.97);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px -20px #000;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px) scale(.9);transform-origin:50% 100%;filter:blur(8px);transition:opacity .45s var(--apple),transform .75s var(--spring),filter .45s var(--apple)}
